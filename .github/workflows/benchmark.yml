name: Performance Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-benchmark:
    name: Build benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build framework packages
        run: pnpm --filter "./packages/*" -r run build

      - name: Generate benchmark app
        run: node scripts/create-bench-app.js

      - name: Install benchmark app dependencies
        working-directory: bench-app
        run: pnpm install --no-frozen-lockfile

      - name: Measure production build
        run: node scripts/bench-build.js
        working-directory: bench-app

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velix-build-benchmark-${{ github.sha }}
          path: bench-app/bench-results.json
          if-no-files-found: warn
          retention-days: 14
